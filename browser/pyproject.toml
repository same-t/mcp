[project]
name = "browser-mcp"
version = "1.0.0"
description = "Browser automation MCP server (SeleniumBase UC mode) compatible with OpenCode and Claude Code"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10,<2",
]

[project.optional-dependencies]
browser = [
    "seleniumbase>=4.40",
]
all = [
    "seleniumbase>=4.40",
]

[project.scripts]
browser-mcp = "browser_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_mcp"]
