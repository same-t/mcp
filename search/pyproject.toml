[project]
name = "search-mcp"
version = "1.0.0"
description = "Web search + fetch MCP server (Python, curl_cffi) over stdio"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10,<2",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
]

[project.scripts]
search-mcp = "search_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling"

[tool.hatch.build.targets.wheel]
packages = ["src/search_mcp"]